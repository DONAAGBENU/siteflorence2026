<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flowerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="512" height="512" rx="64" fill="#ffffff"/>
  
  <!-- Pétales de fleur -->
  <g transform="translate(256, 256)">
    <!-- Pétale supérieur -->
    <ellipse cx="0" cy="-80" rx="35" ry="70" fill="url(#flowerGradient)" transform="rotate(0)"/>
    <!-- Pétale supérieur droit -->
    <ellipse cx="0" cy="-80" rx="35" ry="70" fill="url(#flowerGradient)" transform="rotate(72)"/>
    <!-- Pétale inférieur droit -->
    <ellipse cx="0" cy="-80" rx="35" ry="70" fill="url(#flowerGradient)" transform="rotate(144)"/>
    <!-- Pétale inférieur -->
    <ellipse cx="0" cy="-80" rx="35" ry="70" fill="url(#flowerGradient)" transform="rotate(216)"/>
    <!-- Pétale inférieur gauche -->
    <ellipse cx="0" cy="-80" rx="35" ry="70" fill="url(#flowerGradient)" transform="rotate(288)"/>
    
    <!-- Centre de la fleur -->
    <circle cx="0" cy="0" r="40" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="30" fill="#fcd34d"/>
    
    <!-- Décoration sucre -->
    <circle cx="-15" cy="-10" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="12" cy="-5" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="15" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Feuilles -->
  <path d="M256 320 Q280 380 320 400 Q280 420 256 380 Q232 420 192 400 Q232 380 256 320" fill="url(#leafGradient)"/>
  
  <!-- Texte Fleur Sucré -->
  <text x="256" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#ec4899">Fleur Sucré</text>
</svg>