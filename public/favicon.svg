<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="flowerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="64" height="64" rx="12" fill="#ffffff"/>
  
  <!-- Pétales de fleur simplifiés -->
  <g transform="translate(32, 30)">
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#flowerGradient)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#flowerGradient)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#flowerGradient)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#flowerGradient)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="12" fill="url(#flowerGradient)" transform="rotate(288)"/>
    
    <!-- Centre -->
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
  </g>
</svg>